[build]
  # Playwright chromium is needed by scripts/prerender.mjs (runs as part of
  # `npm run build`) to snapshot /spec/:id pages for SEO.
  # `|| true`: a Playwright CDN hiccup must not block a deploy. prerender.mjs
  # degrades gracefully when chromium is absent.
  command = "(npx playwright install chromium || true) && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Prevent caching of HTML pages (JS/CSS assets have hashed filenames so they're fine)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Force service worker to always revalidate
[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
